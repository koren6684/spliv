url: https://koren6684.github.io/spliv/

template:
  bootstrap: 5
  bootswatch: flatly

reference:
  - title: Get started
    contents:
      - spliv-package
  - title: Main estimation
    contents:
      - spliv
  - title: Pattern definition
    contents:
      - spliv_pattern
      - spliv_eval_pattern
  - title: Sensitivity paths and tipping points
    contents:
      - spliv_sensitivity_path
      - spliv_tipping_point
  - title: Confirmatory BPE
    contents:
      - bpe_design
      - bpe_eval_subset
      - bpe_validate_design
  - title: Exploratory diagnostics
    contents:
      - bpe_explore_subsets
  - title: Advanced low-level interface
    desc: >
      Lower-level interfaces retained for custom workflows. Ordinary users
      should normally prefer `spliv()` and `spliv_sensitivity_path()`.
    contents:
      - sp_ltz
      - sp_uci
      - sp_prior_ltz
      - sp_sensitivity_ltz_normal
      - sp_sensitivity_uci_support
      - sp_sensitivity_ltz_uniform01_as_normal
  - title: Plotting
    contents:
      - plot_sp_sensitivity
